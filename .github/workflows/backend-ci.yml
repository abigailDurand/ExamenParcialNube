# Workflow reutilizable: tests del backend (ver specs/ci-specs.md › backend-tests)
# Lo llama ci-cd.yml; no se ejecuta solo.
name: Backend CI

on:
  workflow_call:
    secrets:
      TEST_JWT_SECRET:
        required: false # si no existe, los tests usan su valor de prueba

jobs:
  test:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: clima_test
          # BD desechable que solo existe dentro del runner: no necesita contraseña
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/clima_test
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Aplicar migraciones a la BD de prueba
        run: python -m db.migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests (falla si la cobertura de /services baja del 80%)
        run: pytest --cov=services --cov-report=term --cov-fail-under=80
