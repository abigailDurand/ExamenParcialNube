# Workflow reutilizable: tests y build del frontend (ver specs/ci-specs.md › frontend-tests)
# Lo llama ci-cd.yml; no se ejecuta solo.
name: Frontend CI

on:
  workflow_call:

jobs:
  test:
    name: Frontend · tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (Vitest)
        run: npm test

      # Sin VITE_BACKEND_URL escrita aquí: solo se comprueba que el build no se rompe
      - name: Build de producción
        run: npm run build
