# CI/CD (ver specs/ci-specs.md)
# pull_request → pruebas + build | push a main → pruebas + build + despliegue en EC2
# Ningún secreto se escribe aquí: todos vienen de GitHub Secrets.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nunca dos despliegues a la vez sobre la misma instancia
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: clima_test
          # BD desechable que solo existe dentro del runner: no necesita contraseña
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/clima_test
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Aplicar migraciones a la BD de prueba
        run: python -m db.migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests (falla si la cobertura de /services baja del 80%)
        run: pytest --cov=services --cov-report=term --cov-fail-under=80

  frontend-tests:
    name: Frontend · tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build

  docker-build:
    name: Docker · build de imágenes
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Crear .env vacíos (en el runner no existen los reales)
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Construir imágenes
        run: docker compose build

  deploy:
    name: Despliegue en EC2
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Desplegar (git pull, compose, migraciones, seeds)
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" bash -s -- "$DEPLOY_PATH" <<'SCRIPT'
          set -euo pipefail
          cd "$1"
          git pull --ff-only origin main
          docker compose up -d --build
          docker compose exec -T backend python -m db.migrate
          docker compose exec -T backend python -m db.seed
          # Nunca "docker compose down -v": borraría la base de datos
          SCRIPT

      - name: Borrar la clave SSH del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
