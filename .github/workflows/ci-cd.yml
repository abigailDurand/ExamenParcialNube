# CI/CD — orquestador (ver specs/ci-specs.md)
# Llama a backend-ci.yml y frontend-ci.yml; luego construye las imágenes y despliega.
# pull_request → pruebas + build | push a main → pruebas + build + despliegue en EC2
# Ningún secreto se escribe aquí: todos vienen de GitHub Secrets.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nunca dos despliegues a la vez sobre la misma instancia
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Los tests viven en workflows reutilizables (workflow_call)
  backend-tests:
    name: Backend
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  frontend-tests:
    name: Frontend
    uses: ./.github/workflows/frontend-ci.yml

  docker-build:
    name: Docker · build de imágenes
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Crear .env vacíos (en el runner no existen los reales)
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Construir imágenes
        run: docker compose build

  deploy:
    name: Despliegue en EC2
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Verificar secretos del despliegue
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          faltan=0
          for nombre in EC2_HOST EC2_USER EC2_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!nombre}" ]; then
              echo "::error::Falta el secreto $nombre (créalo en Settings → Secrets and variables → Actions → Repository secrets)"
              faltan=1
            fi
          done
          exit "$faltan"

      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Desplegar (git pull, compose, migraciones, seeds)
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" bash -s -- "$DEPLOY_PATH" <<'SCRIPT'
          set -euo pipefail
          cd "$1"
          git pull --ff-only origin main
          docker compose up -d --build
          docker compose exec -T backend python -m db.migrate
          docker compose exec -T backend python -m db.seed
          # Nunca "docker compose down -v": borraría la base de datos
          SCRIPT

      - name: Borrar la clave SSH del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
